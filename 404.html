<!DOCTYPE html>
<html lang="de">

  <title>Seite nicht gefunden — Denja Amstutz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="error-page">

              <path d="M118 96c10 12 8 20 3 26"/>
              <circle cx="126" cy="128" r="2.1"/>

            <path class="moka__line" d="M48 108c-22 6-26 30-6 44"/>

            </g>
            <path class="moka__line" d="M62 122v12h36v-12"/>

            <path class="moka__line" d="M58 134h44"/>
            <circle class="moka__line" cx="108" cy="152" r="3.4"/>
            <g class="moka__stove">
              <ellipse cx="80" cy="216" rx="48" ry="9"/>
              <ellipse cx="80" cy="216" rx="30" ry="5"/>
              <g class="moka__flame">
                <path d="M62 208c3-12 10-16 14-6 5-14 12-12 14 1 3-9 9-8 10 5"/>
              </g>
            </g>
            <circle class="moka__knob" cx="80" cy="246" r="8"/>
            <path class="moka__line" d="M80 242v-5"/>

          <p class="moka__status" data-moka-status aria-live="polite">Die Bialetti steht auf dem Herd.</p>
          <button class="moka__btn" type="button" data-moka-toggle>Herd aus</button>
        </aside>
      <div class="error-panel__bar reveal">
        <a class="text-link" href="./">Zurück zur Startseite <span class="icon-arrow" aria-hidden="true"></span></a>
      </div>
    </section>
  </main>

</html>

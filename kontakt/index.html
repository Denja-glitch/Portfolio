<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kontakt zu Denja Amstutz für Multimedia Production, Film und Fotografie.">
  <title>Kontakt - Denja Amstutz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/main.js" defer></script>
</head>
<body class="kontakt-page" id="top">
  <header class="site-header site-header--overlay">
    <a class="wordmark" href="../" aria-label="Startseite">DA<span>.</span></a>
    <nav class="main-nav" aria-label="Hauptnavigation">
      <a class="nav-link" href="../arbeiten/">Arbeiten</a>
      <a class="nav-link" href="../ueber-mich/">Über mich</a>
    </nav>
    <span class="header-spacer" aria-hidden="true"></span>
    <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu" aria-label="Menü"><span class="menu-toggle__bars" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </header>

  <div class="mobile-menu" id="mobile-menu" data-mobile-menu aria-hidden="true">
    <nav class="mobile-menu__nav" aria-label="Mobile Navigation">
      <a class="mobile-menu__link" href="../arbeiten/">Arbeiten</a>
      <a class="mobile-menu__link" href="../ueber-mich/">Über mich</a>
    </nav>
    <div class="mobile-menu__bar">
      <a class="text-link" href="mailto:framesbydenja@gmail.com">framesbydenja@gmail.com</a>
      <a class="text-link" href="https://www.instagram.com/framesbydenja/" target="_blank" rel="noreferrer">Instagram</a>
    </div>
  </div>

  <main class="contact-canvas">
    <div class="contact-canvas__media" aria-hidden="true">
      <video autoplay muted loop playsinline preload="metadata" poster="../assets/images/Still_Simons_Kaffee_Close-2048x1152.webp">
        <source src="../assets/videos/hero-2.mp4" type="video/mp4">
      </video>
    </div>

    <section class="contact-stage section-pad" aria-labelledby="contact-title">
      <div class="contact-info">
        <div class="contact-info__col">
          <p class="contact-info__label">E-Mail</p>
          <a href="mailto:framesbydenja@gmail.com">framesbydenja@gmail.com</a>
        </div>
        <div class="contact-info__col contact-info__col--socials">
          <p class="contact-info__label">Socials</p>
          <a href="https://www.instagram.com/framesbydenja/" target="_blank" rel="noreferrer">@framesbydenja</a>
        </div>
      </div>
      <h1 id="contact-title" class="page-title split-title reveal"><span>Gemeinsam</span><em>kreieren.</em></h1>
    </section>

    <section class="contact-form-section section-pad" id="formular">
      <form class="contact-form reveal" action="https://formspree.io/f/xkjjllyj" method="POST" data-contact-form>
        <div class="contact-form__row">
          <label class="contact-field">
            <span>Name</span>
            <input type="text" name="name" autocomplete="name" maxlength="100" required>
          </label>
          <label class="contact-field">
            <span>E-Mail</span>
            <input type="email" name="email" autocomplete="email" required>
          </label>
        </div>
        <div class="contact-field">
          <span id="projektart-label">Worum geht es?</span>
          <select name="projektart" data-custom-select aria-labelledby="projektart-label">
            <option value="">Bitte wählen</option>
            <option>Film</option>
            <option>Fotografie</option>
            <option>Event</option>
            <option>Social Media</option>
            <option>Etwas anderes</option>
          </select>
        </div>
        <label class="contact-field">
          <span>Nachricht</span>
          <textarea name="message" rows="5" maxlength="3000" required></textarea>
        </label>
        <input type="hidden" name="_subject" value="Neue Anfrage über das Portfolio">
        <input class="contact-form__trap" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="contact-form__submit" type="submit">Senden</button>
        <p class="contact-form__status" role="status" aria-live="polite" data-contact-status></p>
      </form>
    </section>
  </main>

  <footer class="page-footer page-footer--rise section-pad">
    <a class="page-footer__mark" href="../ueber-mich/" aria-label="Über mich">Denja Amstutz<span>.</span></a>
    <div class="page-footer__bottom">
        <a class="page-footer__legal" href="../datenschutz/">Datenschutz</a>
      <p class="page-footer__copy">© 2026 Denja Amstutz</p>
    </div>
  </footer>
</body>
</html>

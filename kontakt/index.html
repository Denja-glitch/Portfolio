<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kontakt zu Denja Amstutz für Multimedia Production, Film und Fotografie.">
  <title>Lass uns reden — Denja Amstutz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/main.js" defer></script>
</head>
<body class="contact-page">
  <header class="site-header">
    <a class="wordmark" href="../" aria-label="Startseite">DA<span>.</span></a>
    <nav class="main-nav" aria-label="Hauptnavigation">
      <a class="nav-link" href="../">Home</a>
      <a class="nav-link" href="../portfolio/">Meine Arbeiten</a>
    </nav>
    <a class="header-contact" href="./" aria-current="page">Let's Talk <span class="icon-arrow" aria-hidden="true"></span></a>
  </header>

  <main>
    <section class="contact-stage section-pad" aria-labelledby="contact-title">
      <div class="contact-time reveal">
        <p class="contact-prompt">Hast du Zeit?</p>
        <div class="contact-clock" data-contact-clock aria-label="Aktuelle Uhrzeit">
          <div class="contact-clock__cell">
            <span data-clock-day>FR</span>
            <span class="contact-clock__label">Tag</span>
          </div>
          <span class="contact-clock__sep" aria-hidden="true">:</span>
          <div class="contact-clock__cell">
            <span data-clock-hours>00</span>
            <span class="contact-clock__label">Stunden</span>
          </div>
          <span class="contact-clock__sep" aria-hidden="true">:</span>
          <div class="contact-clock__cell">
            <span data-clock-minutes>00</span>
            <span class="contact-clock__label">Minuten</span>
          </div>
          <span class="contact-clock__sep" aria-hidden="true">:</span>
          <div class="contact-clock__cell">
            <span data-clock-seconds>00</span>
            <span class="contact-clock__label">Sekunden</span>
          </div>
        </div>
      </div>
      <div class="contact-body">
        <h1 id="contact-title" class="page-title split-title reveal"><span>Gemeinsam</span><em>kreieren.</em></h1>
        <div class="contact-copy reveal">
          <p>Lass uns Zeit nehmen, um über neue Ideen, spannende Kollaborationen und gemeinsame Visionen zu sprechen.</p>
          <a class="contact-mail" href="mailto:framesbydenja@gmail.com">framesbydenja@gmail.com <span class="icon-arrow" aria-hidden="true"></span></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="page-footer section-pad">
    <div class="page-footer__top">
      <a class="wordmark" href="../" aria-label="Startseite">DA<span>.</span></a>
      <a class="page-footer__cta" href="./" aria-current="page">Let's <em>Talk</em> <span class="icon-arrow" aria-hidden="true"></span></a>
      <p class="page-footer__copy">© 2026 Denja Amstutz</p>
    </div>
  </footer>
</body>
</html>
